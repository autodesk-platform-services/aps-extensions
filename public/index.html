<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viewer Extensions</title>
  <link rel="shortcut icon" href="https://cdn.autodesk.io/favicon.ico">
  <!-- Autodesk Platform Services Viewer v8 files. When v8 reaches general availability, they move to /viewers/8.*/ -->
  <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style-v8.min.css" type="text/css">
  <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D-v8.min.js"></script>
  <!-- This project's files -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="extensions/extensionloader.css" />
  <script src="js/browser.js"></script>
  <script src="js/viewer.js"></script>
  <script src="extensions/extensionloader.js"></script>
</head>

<body>
  <header class="app-header">
    <a class="brand" href="https://aps.autodesk.com" target="_blank" rel="noopener">
      <img alt="Autodesk Platform Services" src="https://cdn.autodesk.io/logo/black/stacked.png" height="20">
      <span>Viewer Extensions</span>
    </a>
    <a class="header-link" href="https://github.com/autodesk-platform-services/aps-extensions" target="_blank" rel="noopener">GitHub</a>
  </header>

  <div class="app-layout">
    <aside class="panel models-panel" aria-labelledby="models-heading">
      <div class="panel-heading">
        <h2 id="models-heading">Sample models</h2>
      </div>
      <ul id="appModels" class="model-list"></ul>
      <p id="modelsStatus" class="status" role="status"></p>
    </aside>

    <main class="viewer-pane">
      <p id="viewerMessage" class="viewer-message" role="status">
        &larr; Select a model to load the viewer and extensions
      </p>
      <div id="apsViewer"></div>
    </main>

    <aside class="panel extensions-panel" aria-labelledby="extensions-heading">
      <div class="panel-heading">
        <h2 id="extensions-heading">Extensions</h2>
      </div>
      <div class="tabs">
        <input type="radio" name="extension-tab" id="tab-custom" checked>
        <label for="tab-custom">Custom</label>
        <input type="radio" name="extension-tab" id="tab-inbuilt">
        <label for="tab-inbuilt">Built-in</label>
        <div id="extensionlist" class="tab-panel"></div>
        <div id="inbuiltextensionlist" class="tab-panel"></div>
      </div>
    </aside>
  </div>

  <dialog id="editConfigModal" aria-labelledby="editConfigTitle">
    <form method="dialog" id="editConfigForm">
      <h2 id="editConfigTitle">Edit extension options</h2>
      <label for="editextensionconfig" class="visually-hidden">Extension options (JSON)</label>
      <textarea id="editextensionconfig" spellcheck="false"></textarea>
      <p id="editConfigError" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <a id="learnmore" target="_blank" rel="noopener" href="#">Learn more</a>
        <button type="button" id="cancelconfig">Cancel</button>
        <button type="submit" id="saveconfig" class="primary">Apply</button>
      </div>
    </form>
  </dialog>
</body>

</html>
